# ==========================================================================
# 古着せどり・バイヤー向け市場データ自動収集 & レポート生成パイプライン設定
# ==========================================================================

# レポート化したい市場（複数指定すると全て横断集計される）。
# レギュラー古着・ビンテージ古着を問わず網羅するため、汎用ワードと
# ビンテージ特化ワードの両方を入れてある。
keywords:
  - "古着"
  - "古着 メンズ"
  - "古着 レディース"
  - "ヴィンテージ"
  - "アメカジ"
  - "デッドストック"
  - "古着 ブランド"

# 追跡したいブランド（空なら全ブランド対象でトレンド抽出）。
# collect_all() が自動的に「<ブランド名> 古着」という検索ワードも
# 追加生成するため、ここに挙げたブランドは keywords とは別に個別で
# 検索・収集される（レギュラー品・ビンテージ品どちらも拾う）。
watch_brands:
  - "Champion"
  - "Levi's"
  - "Patagonia"
  - "POLO RALPH LAUREN"
  - "Carhartt"
  - "Supreme"

# ---------------------------------------------------------------------------
# データソースごとの収集設定
# ---------------------------------------------------------------------------
sources:
  yahoo_auction:
    enabled: true
    # https://auctions.yahoo.co.jp/closedsearch/closedsearch/<keyword>/0 を使用
    max_pages_per_keyword: 3          # 1ページ ~50件。控えめな既定値。
    request_interval_sec: 2.5         # 相手サーバー負荷を抑えるための最小間隔

  mercari:
    enabled: true
    # ヘッドレスブラウザ（Playwright/Chromium）でレンダリングして収集する。
    # それでも反スクレイピング対策の変更で壊れる可能性はあるため best-effort。
    # 失敗時は data/manual/ に置いた手動エクスポートCSVへ自動フォールバックする。
    max_items_per_keyword: 100
    request_interval_sec: 3.0
    status: "sold_out"                # 成約済みのみ対象

  base_ec:
    enabled: true
    # 監視したいBASEショップの公開URLを列挙する（各ショップの利用規約を確認の上、設定すること）
    shop_urls:
      - "https://example-vintage-shop.thebase.in/"
    request_interval_sec: 2.0
    # false: 販売中・完売どちらも収集（BASE販売価格とフリマ相場の比較に使う）
    # true : 完売商品のみに絞る
    sold_out_only: false

  vintage_shops:
    enabled: true
    request_interval_sec: 2.5
    # 独立系ヴィンテージ古着店（BASE以外の独自EC）。プラットフォームごとに
    # strategy を切り替える:
    #   link_pattern : 商品ページURLのパターンが分かっている場合（既定）
    #   generic_card : URLパターンが未確認の場合、画像リンク＋近傍の価格で拾う
    #   shopify_json : Shopify製ショップは公開 /products.json を直接叩く（最も確実）
    # force_sold: true の list_urls は「完売専用ページ」なので中身は全て売約済み扱い。
    shops:
      - name: "berberjin"
        strategy: "link_pattern"
        item_url_fragment: "/view/item/"
        max_pages: 5
        list_urls:
          - url: "https://webstore.berberjin.com/view/category/sold?sort=price"
            force_sold: true

      - name: "mushroom"
        strategy: "generic_card"
        # 商品ページURLの形式が未確認のため画像+価格の汎用抽出を使用。
        # cbid=1809250 は「SOLDOUT」カテゴリ（要: 定期的な妥当性確認）。
        max_pages: 10
        list_urls:
          - url: "https://vintage-mushroom.net/?mode=cate&cbid=1809250&csid=0&sort=p"
            force_sold: true

      - name: "safari"
        strategy: "link_pattern"
        item_url_fragment: "/products/detail/"
        max_pages: 10
        list_urls:
          - url: "https://e-safari.co.jp/products/list"
            force_sold: false   # 一覧ページは販売中・完売が混在する想定

      - name: "acorn"
        strategy: "shopify_json"
        base_url: "https://acorn-onlinestore.com"
        max_pages: 10

  sns_hashtags:
    enabled: false
    # Instagram は公式Graph APIがビジネスアカウント連携必須かつ機能制限が大きいため、
    # 既定では無効。手動でハッシュタグの投稿数・伸び傾向をdata/manual/hashtags.csvに
    # 記録して読み込む運用を推奨。
    manual_file: "data/manual/hashtags.csv"

# ---------------------------------------------------------------------------
# 手動データフォールバック（スクレイパーが失敗/未対応でも必ず読み込まれる）
# ---------------------------------------------------------------------------
manual_data_dir: "data/manual"

# ---------------------------------------------------------------------------
# レポート生成設定
# ---------------------------------------------------------------------------
report:
  model: "claude-sonnet-5"
  max_tokens: 8000
  output_dir: "data/reports"
  # 分析対象期間（直近N日をレポート化）
  lookback_days: 7
  # note有料エリアの想定販売価格帯などをレポートに明示させたい場合のヒント
  currency: "JPY"
