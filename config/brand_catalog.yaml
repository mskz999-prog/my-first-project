# ==========================================================================
# 古着せどり 定番ブランド×代表モデル/型番 カタログ
# ==========================================================================
# レギュラー古着・ビンテージ古着を問わず、日本の古着せどり・バイヤー界隈で
# 定番として扱われるブランドと、検索キーワードとして機能する代表的な
# モデル名・型番・通称タグを列挙したもの。
#
# 用途:
#   1. collect.py がここから「ブランド名 + モデル名」の組み合わせキーワードを
#      生成し、ヤフオク/メルカリを検索してより解像度の高い実売データを集める
#      （config.yaml の watch_brands はブランド単位の粗い集計用、こちらは
#      アイテム/型番レベルのトレンド分析用）。
#   2. collect.py がタイトルマッチングでスクレイピング済みアイテムに
#      brand / model を事後的にタグ付けする際の辞書としても使う。
#
# tier:
#   regular          = 現行品でも定番的に流通し、サイズ調達しやすいブランド
#   vintage-specialty = 実物ミリタリー・Americana・古着専門店で扱われる
#                        年代物中心のブランド
#   streetwear       = ストリート/Y2K系（古着屋でも取り扱いが多い）
#   outdoor          = アウトドア/機能系
#   denim-japan      = 日本製レプリカ/リジッドデニムブランド（国内古着市場で
#                        独自の高需要がある）
#   sports-license   = スポーツリーグ/大学ライセンスもの（NFL/NBA/MLB/NCAA等）
#
# モデル名は「実売検索で使われる通称・略称」を優先しており、必ずしも
# メーカーの正式な型番表記と一致しない場合がある（例: 「赤耳」「ビッグE」は
# タグ・仕様の通称）。

