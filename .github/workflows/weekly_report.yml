name: Weekly Vintage Resale Report

on:
  schedule:
    # Every Monday 09:00 JST = 00:00 UTC Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (collect + generate report)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main run

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/manual/hashtags.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly vintage resale report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vintage-resale-report
          path: data/reports/*.md
          retention-days: 90
