name: Weekly Vintage Resale Report

on:
  schedule:
    # Every Monday 09:00 JST = 00:00 UTC Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Not secrets: these identifiers only let the workflow request a
      # short-lived token, and the federation rule restricts who can use
      # them to workflows running in this exact repository. See
      # https://platform.claude.com/settings/workload-identity
      ANTHROPIC_ORGANIZATION_ID: b58a22af-1b3d-4618-97c5-a5e514e97aca
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_014wB1aWSe2jeb7vmuQCQET8
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_017cGBTmq4w44wnZUU7dgkgT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Anthropic Workload Identity token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN', token);

            // TEMPORARY DEBUG: log the token's sub/aud claims (not the
            // token itself) so we can match the federation rule's subject
            // prefix against what GitHub actually sends. Remove once the
            // rule is confirmed working.
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            core.info(`OIDC sub claim: ${payload.sub}`);
            core.info(`OIDC aud claim: ${JSON.stringify(payload.aud)}`);

      - name: Run pipeline (collect + generate report)
        run: python -m src.main run

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/manual/hashtags.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly vintage resale report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vintage-resale-report
          path: data/reports/*.md
          retention-days: 90
