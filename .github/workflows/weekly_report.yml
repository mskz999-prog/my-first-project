name: Weekly Vintage Resale Report

on:
  schedule:
    # Every Monday 09:00 JST = 00:00 UTC Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      quick_test:
        description: >-
          Quick test run: restrict config/brand_catalog.yaml to a small
          representative brand sample (item_keywords stays in full) so the
          whole run finishes in well under an hour, for trying out
          brand_catalog.yaml edits without waiting for the full ~450-combo
          sweep. Output goes to a *-quick-test.md file, never overwriting
          the real weekly report. Ignored when `brands` is set.
        type: boolean
        default: false
      brands:
        description: >-
          Optional: comma-separated exact brand_catalog.yaml brand name(s),
          e.g. "Levi's" or "Levi's,Wrangler". Narrows the whole run to just
          that brand's catalog combos/aliases (overrides quick_test) — for
          a fast, focused test of one brand (e.g. checking era/variant tag
          accuracy against real listings). Output goes to a
          *-focus-<brand>.md file.
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    # collect now sweeps ~650 keywords from config/brand_catalog.yaml (brand+
    # model combos, brand katakana aliases, and brand-agnostic item-type
    # terms) across both Yahoo Auction and Mercari (the latter via a real
    # headless browser per keyword) — a single scraper pass alone can run
    # well past the old 30-minute budget, so this gives real headroom for
    # the full collect -> report pipeline.
    timeout-minutes: 330
    env:
      # Not secrets: these identifiers only let the workflow request a
      # short-lived token, and the federation rule restricts who can use
      # them to workflows running in this exact repository. See
      # https://platform.claude.com/settings/workload-identity
      ANTHROPIC_ORGANIZATION_ID: b58a22af-1b3d-4618-97c5-a5e514e97aca
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_014wB1aWSe2jeb7vmuQCQET8
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_017cGBTmq4w44wnZUU7dgkgT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for Mercari scraping)
        run: playwright install --with-deps chromium

      - name: Collect market data
        id: collect
        env:
          QUICK: ${{ github.event.inputs.quick_test == 'true' && '1' || '' }}
          BRANDS: ${{ github.event.inputs.brands }}
        run: |
          ARGS=()
          if [ -n "$QUICK" ]; then ARGS+=(--quick); fi
          if [ -n "$BRANDS" ]; then ARGS+=(--brands "$BRANDS"); fi
          RAW_PATH=$(python -m src.main collect "${ARGS[@]}" | tail -1)
          echo "raw_path=$RAW_PATH" >> "$GITHUB_OUTPUT"

      # Fetched here, right before the report-generation API call, rather
      # than before data collection: collection (esp. Mercari's headless
      # browser + the vintage shop scrapers) can take several minutes, and
      # GitHub's OIDC identity tokens expire in ~5 minutes — fetching it
      # earlier caused report generation to fail with a WorkloadIdentityError
      # (jwt_expired) once collection grew past that window.
      - name: Get Anthropic Workload Identity token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN', token);

      - name: Generate report from collected data
        env:
          QUICK: ${{ github.event.inputs.quick_test == 'true' && '1' || '' }}
          BRANDS: ${{ github.event.inputs.brands }}
        run: |
          ARGS=(--input "${{ steps.collect.outputs.raw_path }}")
          if [ -n "$QUICK" ]; then ARGS+=(--quick); fi
          if [ -n "$BRANDS" ]; then ARGS+=(--brands "$BRANDS"); fi
          python -m src.main report "${ARGS[@]}"

      - name: Commit generated report
        env:
          QUICK: ${{ github.event.inputs.quick_test == 'true' && '1' || '' }}
          BRANDS: ${{ github.event.inputs.brands }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/manual/hashtags.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            if [ -n "$BRANDS" ]; then
              MSG="chore: brand-focused ($BRANDS) vintage resale report $(date -u +%Y-%m-%d)"
            elif [ -n "$QUICK" ]; then
              MSG="chore: quick-test vintage resale report $(date -u +%Y-%m-%d)"
            else
              MSG="chore: weekly vintage resale report $(date -u +%Y-%m-%d)"
            fi
            git commit -m "$MSG"
            # Collection can run for the better part of an hour, so the
            # branch may have moved (e.g. someone pushing code changes)
            # between checkout and this push — a plain `git push` then
            # gets rejected outright. Rebase onto the latest branch tip
            # and retry a few times rather than failing the whole run
            # over an unrelated race.
            attempt=0
            until git push; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "::error::git push failed after $attempt attempts"
                exit 1
              fi
              echo "push rejected (attempt $attempt) — fetching + rebasing onto origin/$GITHUB_REF_NAME and retrying"
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              sleep 3
            done
          fi

      - name: Upload report as workflow artifact
        # Runs even if the commit/push step above failed, so the generated
        # report is still recoverable from the run's Artifacts tab instead
        # of being silently lost with the ephemeral runner.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vintage-resale-report
          path: data/reports/*.md
          retention-days: 90
